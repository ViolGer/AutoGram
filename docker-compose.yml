services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/code
      - ./data:/code/data

    depends_on:
      - redis

  worker:
    build: .
    command: uv run celery -A app.celery_worker:celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UV_LINK_MODE: copy
    volumes:
      - .:/code
      - ./data:/code/data

    depends_on:
      - redis

  flower:
    build: .
    command: uv run celery -A app.celery_worker:celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/code
      - ./data:/code/data
    depends_on:
      - redis
      - worker

  beat:
    build: .
    command: uv run celery -A app.celery_worker:celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - .:/code
      - ./data:/code/data
    depends_on:
      - redis
      - worker
